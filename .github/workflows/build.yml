name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: The version to put in the file names
        type: string
        required: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
          # The oldest Ubuntu runner, so the program runs on older glibc.
          - name: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          if [ "$RUNNER_OS" = macOS ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Test
        run: cargo test --release --locked

      - name: Build and pack
        run: scripts/package.sh "${{ inputs.version || '' }}"

      - name: Check that it runs
        run: |
          case "$RUNNER_OS" in
            macOS) exe="target/macos/Parrot Cart MIDI.app/Contents/MacOS/parrot-midi" ;;
            Windows) exe=target/release/parrot-midi.exe ;;
            Linux) exe=target/release/parrot-midi ;;
          esac
          "$exe" --version | tee version.txt
          grep -q "parrot-midi" version.txt
          "$exe" --list
          if [ "$RUNNER_OS" = macOS ]; then lipo -info "$exe"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parrot-midi-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
